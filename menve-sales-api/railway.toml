# Menve Sales API — Railway (https://railway.app)
# Painel: Root Directory = raiz do monorepo (onde está o package.json principal).
# Dockerfile path = menve-sales-api/Dockerfile
[build]
builder = "DOCKERFILE"
dockerfilePath = "menve-sales-api/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
