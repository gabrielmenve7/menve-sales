# Railway lê este arquivo quando Root Directory = raiz do monorepo (vazio no painel).
# Sem ele na raiz, a Railway usa Nixpacks (apt, libatomic1) e pode falhar ou ignorar o Dockerfile.
[build]
builder = "DOCKERFILE"
dockerfilePath = "menve-sales-api/Dockerfile"

[deploy]
# Imagem Docker já usa WORKDIR /app e CMD node dist/main.js. Se no painel existir
# "Start Command" com `cd ... &&`, a Railway tenta executar `cd` como binário → erro.
# Este valor fixa o start via config-as-code (substitui overrides inválidos ao merge).
startCommand = "node dist/main.js"
# /health pode retornar 503 se o Neon estiver lento; /health/live não depende do DB.
healthcheckPath = "/health/live"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
