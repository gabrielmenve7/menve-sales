<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Menve — WhatsApp Web</title>
    <style>
      :root {
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }
      body {
        margin: 0;
        padding: 12px;
        font-size: 13px;
        line-height: 1.45;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
      }
      .top-actions {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      button.btn-icon {
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        background: #fff;
        color: #334155;
      }
      button.btn-icon:hover {
        background: #f1f5f9;
      }
      .muted {
        color: #64748b;
      }
      .card {
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
      }
      .tag {
        display: inline-block;
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 999px;
        margin-right: 6px;
        margin-bottom: 4px;
        background: #f1f5f9;
      }
      a.btn {
        display: inline-block;
        padding: 8px 12px;
        background: #2563eb;
        color: #fff !important;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 500;
        font-size: 12px;
      }
      a.btn:hover {
        background: #1d4ed8;
      }
      .deal {
        padding: 8px 0;
        border-bottom: 1px solid #f1f5f9;
      }
      .deal:last-child {
        border-bottom: none;
      }
      .err {
        color: #b91c1c;
        font-size: 12px;
      }
      code {
        font-size: 11px;
        word-break: break-all;
      }
      .pulse {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #22c55e;
        animation: pulse 1.2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
    </style>
  </head>
  <body>
    <div class="topbar">
      <h1>Menve Sales</h1>
      <div class="top-actions">
        <button type="button" class="btn-icon" id="btnRefresh" title="Recarregar lead">
          Atualizar
        </button>
        <button type="button" class="btn-icon" id="btnOpts" title="API e token">
          Opções
        </button>
      </div>
    </div>
    <div id="root"></div>
    <script src="sidepanel.js"></script>
  </body>
</html>
