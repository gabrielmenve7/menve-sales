name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/menve_test
  DIRECT_URL: postgresql://postgres:postgres@localhost:5432/menve_test
  NEXTAUTH_SECRET: ci-secret-at-least-32-characters-long!!
  NEXTAUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  PLAYWRIGHT_BASE_URL: http://localhost:3000
  INTERNAL_API_URL: http://127.0.0.1:4000
  INTERNAL_API_KEY: ci-internal-api-key
  JWT_SECRET: ci-jwt-secret-at-least-32-characters-long!!
  PUBLIC_APP_URL: http://127.0.0.1:4000

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: menve_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d menve_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix menve-sales-api

      - name: Prisma migrate
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test -- --run

      - name: Build API
        run: npm run build --prefix menve-sales-api

      - name: Build web
        run: npm run build

      - name: Install Playwright (Chromium)
        run: npx playwright install chromium --with-deps

      - name: E2E (API health)
        run: npm run test:e2e
